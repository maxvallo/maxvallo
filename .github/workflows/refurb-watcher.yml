name: refurb-watcher

on:
  schedule:
    - cron: "17 5-21/2 * * *"   # alle 2 Stunden zwischen ca. 7 und 23 Uhr (MESZ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refurb-watcher
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: refurb-watcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: refurb-watcher/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q

      - name: Crawlen & benachrichtigen
        run: python -m refurb_watcher run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Zustand & Bericht committen
        if: always()
        run: |
          git config user.name "refurb-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "refurb-watcher: Stand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
