name: refurb-watcher

on:
  schedule:
    - cron: "17 5-21/2 * * *"   # alle 2 Stunden zwischen ca. 7 und 23 Uhr (MESZ)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Nur eine Testnachricht senden (nicht crawlen)"
        type: boolean
        default: false
      debug:
        description: "Debug: geladene Seiten als Artefakt speichern, nichts committen/benachrichtigen"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: Europe/Berlin

concurrency:
  group: refurb-watcher
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: refurb-watcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: refurb-watcher/requirements*.txt

      - run: pip install -r requirements-dev.txt playwright

      # Browser für Shops mit Bot-Schutz (asgoodasnew, Back Market)
      - run: python -m playwright install --with-deps chromium

      - run: python -m pytest -q

      - name: Crawlen & benachrichtigen
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python -m refurb_watcher test-notify
          elif [ "${{ inputs.debug }}" = "true" ]; then
            DEBUG_HTML_DIR=debug-html python -m refurb_watcher -v run --dry-run
          else
            python -m refurb_watcher run
          fi
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Debug-Seiten hochladen
        if: always() && inputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: |
            refurb-watcher/debug-html
            refurb-watcher/reports/latest.md
          retention-days: 3

      - name: Zustand & Bericht committen
        if: always() && !inputs.debug
        run: |
          git config user.name "refurb-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "refurb-watcher: Stand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
