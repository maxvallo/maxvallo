# Refurb-Watcher Konfiguration
#
# watches: was gesucht wird. Jede Zeile in "require" ist eine UND-Bedingung,
#   die Einträge darin sind ODER-Alternativen. Begriffe werden als ganze
#   Wörter gesucht (Groß-/Kleinschreibung egal, "-" und "_" zählen als
#   Leerzeichen). Mit "re:" beginnt ein regulärer Ausdruck.
# shops: wo gesucht wird. start_urls werden geladen, Angebote darauf
#   ausgelesen und Produktlinks (product_link_regex) eine Ebene tiefer verfolgt.

watches:
  - id: macbook-air-m4
    name: 'MacBook Air M4 (2025) 13"/15" Mitternacht'
    alert_below: 1100
    require:
      - ["macbook air"]
      - ["m4"]
      # Das M4-Air gibt es nur in 13" und 15" – daher keine Größen-Bedingung.
      - ["re:mitternacht|midnight"]
    exclude:
      - "macbook pro"
      - "re:\\bm4\\s+(pro|max)\\b"

  - id: ipad-air-11-m3
    name: 'iPad Air 11" M3 (2025)'
    alert_below: 500
    require:
      - ["ipad air"]
      # Das iPad Air von 2025 (7. Generation) gibt es nur mit M3
      - ["m3", "ipad air 7", "re:ipad air\\D{0,15}2025"]
      - ["11"]
    exclude:
      - "ipad pro"
      - "ipad mini"
      - "re:\\b13(?:[.,]\\d)?\\s*(\"|''|zoll|inch)"

shops:
  - id: refurbed
    name: refurbed
    start_urls:
      - https://www.refurbed.de/p/apple-macbook-air-m4-2025/
      - https://www.refurbed.de/p/apple-macbook-air-m4-2025-15/
      - https://www.refurbed.de/p/ipad-air-7-2025-11/
    product_link_regex: '/p/(apple-macbook-air-m4-2025[^/]*|ipad-air-7-2025-11|apple-ipad-air[^/]*m3[^/]*)/'
    # Jede Farb-/Speicher-Variante hat eine numerische ID (z. B. /p/…/307979b/), der
    # Buchstabe dahinter ist der Zustand. Nur Links zu IDs passender Varianten verfolgen:
    # Startseite -> passende Varianten -> deren Zustands-Seiten.
    link_id_regex: '/p/[^/]+/(\d+)[a-z]*/'
    link_ignore_query: true
    max_depth: 2
    max_product_pages: 120
    condition_from_url:
      - ['/\d+aa/', 'Premium']
      - ['/\d+b/', 'Sehr gut']
      - ['/\d+c/', 'Gut']
      - ['/\d+/', 'Exzellent']

  # asgoodasnew und Back Market blocken Zugriffe von GitHub-Servern (HTTP 403, auch mit
  # echtem Browser). Auf einem Rechner mit privatem Internetanschluss (z. B. Raspberry Pi)
  # funktionieren sie evtl. – dafür "enabled: true" setzen.
  - id: asgoodasnew
    name: asgoodasnew
    enabled: false
    start_urls:
      - https://asgoodasnew.de/search?search=macbook%20air%20m4
      - https://asgoodasnew.de/search?search=ipad%20air%20m3
    product_link_regex: '(macbook-air[^/]*m4|ipad-air[^/]*m3)'
    max_product_pages: 40
    fetcher: playwright   # blockt einfache HTTP-Clients (HTTP 403)

  - id: backmarket
    name: Back Market
    enabled: false
    start_urls:
      - https://www.backmarket.de/de-de/search?q=macbook%20air%20m4
      - https://www.backmarket.de/de-de/search?q=ipad%20air%2011%20m3
    product_link_regex: '/de-de/p/(macbook-air[^/]*m4|ipad-air[^/]*m3)'
    max_product_pages: 30
    # Back Market blockt einfache HTTP-Clients (HTTP 403) -> echter Browser
    # (pip install playwright; python -m playwright install chromium)
    fetcher: playwright

  - id: rebuy
    name: rebuy
    enabled: false   # optional einschalten
    start_urls:
      - https://www.rebuy.de/kaufen/suchen?q=macbook%20air%20m4
      - https://www.rebuy.de/kaufen/suchen?q=ipad%20air%2011%20m3
    product_link_regex: '/i,\d+/[^"]*(macbook-air|ipad-air)'
    max_product_pages: 30

settings:
  state_file: data/state.json
  report_file: reports/latest.md
  # Pause zwischen zwei Requests (Sekunden, zufällig im Bereich) – höflich crawlen.
  delay_seconds: [2, 5]
  timeout_seconds: 25
  respect_robots_txt: true
  # Zusätzlich zu Preisalarmen eine Sammelnachricht bei neuen Angeboten? (aus: nur Preisalarme)
  notify_new_offers: false
  # Angebote, die so viele Läufe in Folge fehlen, gelten als verschwunden.
  gone_after_missed_runs: 2
